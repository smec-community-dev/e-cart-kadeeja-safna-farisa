<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ product.product_name }}</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #0b0b0c;
      color: #ffffff;
    }
    .product-card {
      background: #141417;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 0 12px rgba(255,255,255,0.05);
    }
    .main-image {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid #222;
    }
    .thumb-img {
      width: 75px;
      height: 75px;
      object-fit: cover;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid transparent;
      transition: 0.3s;
    }
    .thumb-img:hover {
      border-color: #8b5cf6;
      transform: scale(1.05);
    }
    .price {
      font-size: 28px;
      font-weight: bold;
      color: #eab308; /* Yellow */
    }
    .btn-buy {
      background: #8b5cf6;
      border: none;
    }
    .btn-buy:hover {
      background: #6d28d9;
    }
  </style>
</head>
<body>

<div class="container py-4">

  <a href="{% url 'home' %}" class="btn btn-outline-light mb-4">⬅ Back to Home</a>

  <div class="product-card">

    <div class="row g-4">

      <!-- Product Images -->
      <div class="col-md-6">
        {% if images %}
          <img id="mainImage" src="{{ images.0.image.url }}" class="main-image mb-3">
          <div class="d-flex gap-2 flex-wrap">
            {% for img in images %}
              <img src="{{ img.image.url }}" class="thumb-img"
              onclick="document.getElementById('mainImage').src=this.src;">
            {% endfor %}
          </div>
        {% else %}
          <img src="https://via.placeholder.com/400?text=No+Image" class="main-image">
        {% endif %}
      </div>

      <!-- Product Info -->
      <div class="col-md-6">
        <h2 class="fw-bold">{{ product.product_name }}</h2>
        <div class="price mt-2">₹{{ product.product_price }}</div>

        {% if product.stock > 0 %}
          <span class="badge bg-success mt-2">In Stock</span>
        {% else %}
          <span class="badge bg-danger mt-2">Out of Stock</span>
        {% endif %}

        <p class="mt-4 text-secondary" style="line-height:1.7;">
          {{ product.description }}
        </p>

        <div class="mt-4 d-flex gap-3">
         <a href="{% url 'add_to_cart' product.slug %}" class="btn btn-buy btn-lg px-4">🛒 Add to Cart</a>
          <button class="btn btn-warning btn-lg px-4">⚡ Buy Now</button>
        </div>

      </div>

    </div>
  </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
