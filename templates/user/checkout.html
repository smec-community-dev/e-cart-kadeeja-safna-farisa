<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | E-Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">E-Shop</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h3 class="fw-bold mb-4">Checkout</h3>
    <form>
      <div class="row">
        <div class="col-md-6">
          <h5>Shipping Details</h5>
          <input type="text" class="form-control mb-2" placeholder="Full Name">
          <input type="text" class="form-control mb-2" placeholder="Address">
          <input type="text" class="form-control mb-2" placeholder="City">
          <input type="text" class="form-control mb-2" placeholder="Pincode">
        </div>
        <div class="col-md-6">
          <h5>Order Summary</h5>
          <p>Product Total: $49.99</p>
          <p>Shipping: $5.00</p>
          <h6>Total: $54.99</h6>
          <a href="payment.html" class="btn btn-primary w-100 mt-3">Proceed to Payment</a>
        </div>
      </div>
    </form>
  </div>

  <footer><p>© 2025 E-Shop</p></footer>
</body>
</html>
