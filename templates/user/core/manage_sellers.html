<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Sellers</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {
      --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1;
    }

    body {
      background-color: #f8f9fa;
      color: var(--text-primary);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Sidebar */
    .sidebar {
      background: var(--primary-color);
      min-height: 100vh;
      padding-top: 1.5rem;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
    }

    .sidebar h4 {
      color: white;
      font-weight: 600;
    }

    .sidebar a {
      color: rgba(255, 255, 255, 0.9);
      padding: 0.75rem 1.2rem;
      display: block;
      border-radius: 0.5rem;
      margin: 0.3rem 1rem;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: var(--highlight-color);
      color: white;
      transform: translateX(4px);
    }

    .sidebar a i {
      width: 24px;
      text-align: center;
    }

    /* Page Header */
    .page-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .page-header h2 {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* Card */
    .card {
      border: none;
      border-radius: 0.75rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      overflow: hidden;
    }

    .card-body {
      padding: 1.5rem;
    }

    /* Table */
    .table thead {
      background: var(--primary-color);
      color: white;
    }

    .table thead th {
      font-weight: 600;
      border: none;
      padding: 1rem;
    }

    .table tbody td {
      vertical-align: middle;
      padding: 1rem;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }

    .table-hover tbody tr:hover {
      background-color: rgba(99, 102, 241, 0.05);
    }

    /* Badges */
    .badge.bg-success {
      background-color: var(--success-color) !important;
      color: white;
    }

    .badge.bg-warning {
      background-color: #F59E0B !important;
      color: white;
    }

    .badge.bg-danger {
      background-color: var(--error-color) !important;
      color: white;
    }

    .badge.bg-secondary {
      background-color: var(--text-secondary) !important;
      color: white;
    }

    /* Buttons */
    .btn-sm {
      font-size: 0.8rem;
      padding: 0.35rem 0.6rem;
    }

    .btn-success {
      background-color: var(--success-color);
      border: none;
    }

    .btn-success:hover {
      background-color: #15803D;
    }

    .btn-secondary {
      background-color: var(--text-secondary);
      border: none;
    }

    .btn-secondary:hover {
      background-color: #4B5563;
    }

    .btn-danger {
      background-color: var(--error-color);
      border: none;
    }

    .btn-danger:hover {
      background-color: #B91C1C;
    }

    /* Search & Filter */
    .search-filter {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .search-filter .form-control,
    .search-filter .form-select {
      max-width: 300px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        z-index: 1000;
        width: 260px;
        left: -260px;
        transition: left 0.3s ease;
      }
      .sidebar.show {
        left: 0;
      }
      .page-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar text-white col-md-2">
      <h4 class="text-center mb-4">Admin Panel</h4>
      <a href="admin_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="manage_users.html"><i class="bi bi-people"></i> Users</a>
      <a href="manage_sellers.html" class="active"><i class="bi bi-shop"></i> Sellers</a>
      <a href="manage_categories.html"><i class="bi bi-grid"></i> Categories</a>
      <a href="manage_products.html"><i class="bi bi-box"></i> Products</a>
      <a href="manage_orders.html"><i class="bi bi-cart"></i> Orders</a>
      <a href="manage_payments.html"><i class="bi bi-credit-card"></i> Payments</a>
      <a href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
      <a href="admin_login.html"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="flex-fill p-4 p-md-5">
      <div class="page-header">
        <h2>Manage Sellers</h2>
        <button class="btn btn-primary">
          <i class="bi bi-plus-circle"></i> Add Seller
        </button>
      </div>

      <!-- Search & Filter -->
      <div class="search-filter">
        <input type="text" class="form-control" placeholder="Search by shop name or owner...">
        <select class="form-select">
          <option>All Status</option>
          <option>Approved</option>
          <option>Suspended</option>
        </select>
      </div>

      <!-- Sellers Table -->
      <div class="card">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Shop Name</th>
                  <th>Owner</th>
                  <th>Contact</th>
                  <th>Adress</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>
                    <div class="d-flex align-items-center">
                      <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 36px; height: 36px; font-size: 0.9rem;">
                        TT
                      </div>
                      TechTrendz
                    </div>
                  </td>
                  <td>Alex Kim</td>
                  <td><a href="tel:9876543210" class="text-decoration-none">9876543210</a></td>
                  <td>ABC House</td>
                  <td><span class="badge bg-warning">Pending</span></td>
                  <td>
                    <button class="btn btn-sm btn-success" title="Approve">
                      <i class="bi bi-check-circle"></i>
                    </button>
                    <button class="btn btn-sm btn-secondary" title="View">
                      <i class="bi bi-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" title="Suspend">
                      <i class="bi bi-slash-circle"></i>
                    </button>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-between align-items-center mt-4">
        <p class="text-muted mb-0">Showing 1 to 3 of 89 sellers</p>
        <nav>
          <ul class="pagination pagination-sm">
            <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
            <li class="page-item active"><a class="page-link" href="#">1</a></li>
            <li class="page-item"><a class="page-link" href="#">2</a></li>
            <li class="page-item"><a class="page-link" href="#">3</a></li>
            <li class="page-item"><a class="page-link" href="#">Next</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
