<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart | E-Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">E-Shop</a>
    </div>
  </nav>

  <div class="container mt-5">
    <h3 class="fw-bold mb-4">Your Cart</h3>
    <table class="table align-middle">
      <thead>
        <tr>
          <th>Product</th><th>Price</th><th>Quantity</th><th>Total</th><th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sample Product</td>
          <td>$49.99</td>
          <td><input type="number" value="1" class="form-control w-50"></td>
          <td>$49.99</td>
          <td><button class="btn btn-danger btn-sm">Remove</button></td>
        </tr>
      </tbody>
    </table>
    <div class="text-end">
      <h5>Total: $49.99</h5>
      <a href="checkout.html" class="btn btn-primary">Proceed to Checkout</a>
    </div>
  </div>

  <footer><p>© 2025 E-Shop</p></footer>
</body>
</html>
