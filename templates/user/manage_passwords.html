{% extends 'user/profile.html' %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="page-card">
    <h2 class="mb-4 fw-bold text-primary">Change Password</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" class="row g-4">
        {% csrf_token %}

        <div class="col-md-8">
            <label class="form-label fw-bold">Current Password</label>
            <input type="password" name="old_password" class="form-control" required>
        </div>

        <div class="col-md-8">
            <label class="form-label fw-bold">New Password</label>
            <input type="password" name="new_password1" class="form-control" required>
        </div>

        <div class="col-md-8">
            <label class="form-label fw-bold">Confirm New Password</label>
            <input type="password" name="new_password2" class="form-control" required>
        </div>

        <div class="col-12">
            <button type="submit" class="btn btn-success btn-lg px-5">
                Update Password
            </button>
            <a href="{% url 'userapp:dashboard' %}" class="btn btn-outline-secondary btn-lg px-5 ms-3">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
