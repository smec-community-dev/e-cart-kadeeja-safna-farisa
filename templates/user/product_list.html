<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | E-Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">E-Shop</a>
      <form class="d-flex">
        <input class="form-control me-2" type="search" placeholder="Search products">
        <button class="btn btn-light">Search</button>
      </form>
    </div>
  </nav>

  <div class="container mt-4">
    <div class="row mb-3">
      <div class="col-md-3">
        <h5>Filters</h5>
        <div class="card p-3">
          <label>Category</label>
          <select class="form-select mb-3">
            <option>All</option>
            <option>Electronics</option>
            <option>Clothing</option>
          </select>
          <label>Price Range</label>
          <input type="range" class="form-range">
        </div>
      </div>
      <div class="col-md-9">
        <h4 class="fw-semibold">All Products</h4>
        <div class="row g-4 mt-2">
          <div class="col-md-4">
            <div class="card shadow-sm">
              <img src="https://via.placeholder.com/200" class="card-img-top">
              <div class="card-body text-center">
                <h6>Product Name</h6>
                <p>$49.99</p>
                <a href="product_detail.html" class="btn btn-primary btn-sm">View Details</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer><p>© 2025 E-Shop</p></footer>
</body>
</html>
