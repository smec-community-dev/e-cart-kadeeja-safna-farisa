<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home | E-Commerce</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">E-Shop</a>
      
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <form class="d-flex mx-auto mt-2 mt-lg-0">
          <input class="form-control me-2" type="search" placeholder="Search products..." aria-label="Search">
          <button class="btn btn-light" type="submit">Search</button>
        </form>

        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link btn btn-primary text-white px-3 ms-2" href="register.html">Register</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="container mt-5 text-center">
    <h2 class="fw-bold">Welcome to E-Shop</h2>
    <p class="text-secondary">Discover our best products and categories</p>
  </div>

  <!-- Categories -->
  <div class="container mt-4">
    <h4 class="fw-semibold mb-3">Categories</h4>
    <div class="row">
      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h5>Electronics</h5>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h5>Clothing</h5>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h5>Accessories</h5>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm">
          <div class="card-body text-center">
            <h5>Home Decor</h5>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Featured Products -->
  <div class="container mt-5 mb-5">
    <h4 class="fw-semibold mb-3">Featured Products</h4>
    <div class="row g-4">
      <div class="col-md-3">
        <div class="card shadow-sm">
          <img src="https://via.placeholder.com/200" class="card-img-top" alt="Product">
          <div class="card-body text-center">
            <h6 class="card-title">Product Name</h6>
            <p class="text-secondary">$199.00</p>
            <a href="product_detail.html" class="btn btn-primary btn-sm">View</a>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card shadow-sm">
          <img src="https://via.placeholder.com/200" class="card-img-top" alt="Product">
          <div class="card-body text-center">
            <h6 class="card-title">Another Product</h6>
            <p class="text-secondary">$249.00</p>
            <a href="product_detail.html" class="btn btn-primary btn-sm">View</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 E-Shop. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
