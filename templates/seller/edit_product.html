<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="mb-4">Edit Product</h2>

    <!-- Show messages -->
    {% if messages %}
        {% for msg in messages %}
        <div class="alert alert-{{ msg.tags }} alert-dismissible fade show" role="alert">
            {{ msg }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    {% endif %}

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="card p-4 shadow border-0">

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="product_name" value="{{ product.product_name }}" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Price</label>
                    <input type="number" name="product_price" value="{{ product.product_price }}" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Stock</label>
                    <input type="number" name="stock" value="{{ product.stock }}" class="form-control" required>
                </div>

                <div class="col-md-6 mb-3">
                  <label class="form-label">Sub Category</label>
                   <select name="sub_category" class="form-select" required>
                       {% for sc in subcategories %}
                         <option value="{{ sc.sub_category_id }}"
                          {% if product.sub_category.sub_category_id == sc.sub_category_id %}
                            selected
                           {% endif %}
                           >
                           {{ sc.sub_category_name }}
                           </option>
                       {% endfor %}
                 </select>
                </div>


                <div class="col-md-12 mb-3">
                    <label class="form-label">Description</label>
                    <textarea name="description" class="form-control" rows="3">{{ product.description }}</textarea>
                </div>

                <!-- Existing Images -->
                <!-- EXISTING IMAGES WITH DELETE FORM -->
                <div class="col-md-12 mb-3">
                    <label class="form-label">Existing Images</label>
                    <div class="d-flex flex-wrap">

                        {% for img in product.productimage_set.all %}
                        <form action="{% url 'delete_image' img.id %}" method="POST" class="me-2 mb-2">
                            {% csrf_token %}

                            <div class="position-relative" style="display:inline-block;">
                                <!-- Delete button -->
                                <button type="submit"
                                        class="btn btn-danger btn-sm position-absolute top-0 end-0"
                                        onclick="return confirm('Delete this image?')">
                                    ✖
                                </button>

                                <!-- Image -->
                                <img src="{{ img.image.url }}" width="100" height="100"
                                     style="object-fit:cover; border-radius:5px;">
                            </div>
                        </form>
                        {% endfor %}

                    </div>
                </div>

<!-- ADD NEW IMAGES -->
            <div class="col-md-12 mb-3">
                <label class="form-label">Add New Images</label>

                <div id="image-fields">
                    <input type="file" name="images" class="form-control mb-2">
                </div>

                <button type="button" class="btn btn-success btn-sm" onclick="addMoreImages()">+ Add More</button>
            </div>

            <script>
            function addMoreImages() {
                let div = document.getElementById("image-fields");
                let input = document.createElement("input");
                input.type = "file";
                input.name = "images";
                input.className = "form-control mb-2";
                div.appendChild(input);
            }
            </script>

            </div>

            <button type="submit" class="btn btn-primary mt-3">Update Product</button>
            <a href="{% url 'manage_product' %}" class="btn btn-secondary mt-3">Cancel</a>
        </div>
    </form>
</div>
</body>
</html>
