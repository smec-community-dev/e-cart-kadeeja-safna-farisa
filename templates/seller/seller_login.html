<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seller Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    :root {
      --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1;
    }
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      color: var(--text-primary);
      font-family: 'Segoe UI', sans-serif;
    }
    .login-card {
      max-width: 420px;
      margin: 80px auto;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(30, 64, 175, 0.15);
      overflow: hidden;
    }
    .login-header {
      background: var(--primary-color);
      color: white;
      padding: 1.5rem;
      text-align: center;
    }
    .btn-login {
      background: var(--secondary-color);
      border: none;
      font-weight: 600;
      transition: all 0.3s;
    }
    .btn-login:hover {
      background: var(--highlight-color);
      transform: translateY(-2px);
    }
    .form-control:focus {
      border-color: var(--secondary-color);
      box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
    }
  </style>
</head>
<body>
{% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  <div class="container">
    <div class="login-card">
      <div class="login-header">
        <h3>Seller Login</h3>
        <small>Manage your store with ease</small>
      </div>
      <div class="card-body p-4">

        <!-- FORM START -->
        <form method="POST">
          {% csrf_token %}

          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control" placeholder="seller@shop.com" name="username" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="••••••••" name="password" required />
          </div>

          <button type="submit" class="btn btn-login w-100">Login to Dashboard</button>
        </form>
        <!-- FORM END -->

        <div class="text-center mt-3">
          <a href="#" class="text-decoration-none" style="color: var(--secondary-color);">Forgot Password?</a>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
