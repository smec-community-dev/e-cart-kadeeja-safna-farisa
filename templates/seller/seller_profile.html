<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seller Profile</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1; }
      .sidebar { background: var(--primary-color);
      min-height: 100vh;
      padding-top: 20px;
      color: white; }
      .sidebar a {
      color: #e0e7ff;
      padding: 12px 20px;
      display: block;
      border-radius: 8px;
      margin: 5px 15px;
      transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--secondary-color);
      color: white;
      text-decoration: none;
    }
    .profile-img {
      width: 120px; height: 120px; object-fit: cover; border: 4px solid var(--secondary-color);
    }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar col-md-2"> 
      <div class="text-center mb-4"><h5>TechHub Store</h5></div>
      <a href="seller_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="add_product.html"><i class="bi bi-plus-circle"></i> Add Product</a>
      <a href="manage_products.html" ><i class="bi bi-grid"></i> Manage Products</a>
      <a href="add_variant.html" ><i class="bi bi-grid"></i> Add Variant</a>
      <a href="manage_orders.html" ><i class="bi bi-truck"></i> Orders</a>
      <a href="payment_report.html"><i class="bi bi-wallet2"></i> Payments</a>
      <a href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
      <a href="seller_profile.html"class="active"><i class="bi bi-person"></i> Profile</a>
      <a href="../login.html" class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="flex-grow-1 p-4">
      <h2>Seller Profile</h2>
      <div class="card shadow-sm mt-3">
        <div class="card-body">
          <div class="text-center mb-4">
            <img src="../assets/images/shop-logo.png" class="rounded-circle profile-img" alt="Shop Logo">
            <h4 class="mt-3">TechHub Store</h4>
            <p class="text-muted">Electronics & Gadgets</p>
          </div>
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label>Shop Name</label>
                <input type="text" class="form-control" value="TechHub Store" />
              </div>
              <div class="col-md-6">
                <label>Contact Number</label>
                <input type="text" class="form-control" value="+91 98765 43210" />
              </div>
              <div class="col-12">
                <label>Shop Address</label>
                <textarea class="form-control" rows="2">123, MG Road, Bangalore, Karnataka</textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Update Profile</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
