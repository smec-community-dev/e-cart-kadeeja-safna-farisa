<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1; }
    .sidebar { background: var(--primary-color);
      min-height: 100vh;
      padding-top: 20px;
      color: white; }
    .sidebar a {
      color: #e0e7ff;
      padding: 12px 20px;
      display: block;
      border-radius: 8px;
      margin: 5px 15px;
      transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--secondary-color);
      color: white;
      text-decoration: none;
    }
    .status-select { min-width: 140px; }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar col-md-2"> 
        <div class="text-center mb-4"><h5>TechHub Store</h5></div>
      <a href="seller_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="add_product.html"><i class="bi bi-plus-circle"></i> Add Product</a>
      <a href="manage_products.html" ><i class="bi bi-grid"></i> Manage Products</a>
      <a href="add_variant.html" ><i class="bi bi-grid"></i> Add Variant</a>
      <a href="manage_orders.html" class="active"><i class="bi bi-truck"></i> Orders</a>
      <a href="payment_report.html"><i class="bi bi-wallet2"></i> Payments</a>
      <a href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
      <a href="seller_profile.html"><i class="bi bi-person"></i> Profile</a>
      <a href="../login.html" class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="flex-grow-1 p-4">
      <h2>Manage Orders</h2>
      <div class="card shadow-sm mt-3">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover">
              <thead style="background: var(--primary-color); color: white;">
                <tr>
                  <th>Order ID</th>
                  <th>Customer</th>
                  <th>Product</th>
                  <th>Amount</th>
                  <th>Date</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>#ORD1001</td>
                  <td>Amit Sharma</td>
                  <td>Wireless Earbuds</td>
                  <td>₹2,999</td>
                  <td>09 Nov 2025</td>
                  <td>
                    <select class="form-select form-select-sm status-select">
                      <option selected>Processing</option>
                      <option>Shipped</option>
                      <option>Delivered</option>
                      <option>Cancelled</option>
                    </select>
                  </td>
                  <td><button class="btn btn-sm btn-primary">Update</button></td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
