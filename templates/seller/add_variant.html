<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Variant</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root {  --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1;}
    .sidebar { background: var(--primary-color);
      min-height: 100vh;
      padding-top: 20px;
      color: white; }
    .sidebar a {
      color: #e0e7ff;
      padding: 12px 20px;
      display: block;
      border-radius: 8px;
      margin: 5px 15px;
      transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--secondary-color);
      color: white;
      text-decoration: none;
    }
    .variant-card { border: 1px dashed var(--secondary-color); border-radius: 12px; padding: 1rem; }
    .color-preview {
      width: 30px; height: 30px; border-radius: 50%; display: inline-block; margin-right: 8px;
      border: 2px solid #ddd;
    }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar col-md-2"> 
    <div class="text-center mb-4"><h5>TechHub Store</h5></div>
      <a href="seller_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="add_product.html"><i class="bi bi-plus-circle"></i> Add Product</a>
      <a href="manage_product.html"><i class="bi bi-grid"></i> Manage Products</a>
      <a href="add_variant.html" class="active"><i class="bi bi-grid"></i> Add Variant</a>
      <a href="manage_order.html"><i class="bi bi-truck"></i> Orders</a>
      <a href="payment_report.html"><i class="bi bi-wallet2"></i> Payments</a>
      <a href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
      <a href="seller_profile.html"><i class="bi bi-person"></i> Profile</a>
      <a href="../login.html" class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="flex-grow-1 p-4">
      <h2>Add Variant for <strong>Wireless Earbuds Pro</strong></h2>
      <div class="card shadow-sm mt-3">
        <div class="card-body">
          <form>
            <div class="row g-3">
              <div class="col-md-6">
                <label>Variant Name</label>
                <input type="text" class="form-control" placeholder="e.g., Black Edition" />
              </div>
              <div class="col-md-6">
                <label>SKU Code</label>
                <input type="text" class="form-control" placeholder="SKU-001-BLK" />
              </div>
              <div class="col-md-4">
                <label>Color</label>
                <select class="form-select">
                  <option>Black</option>
                  <option>White</option>
                  <option>Blue</option>
                </select>
              </div>
              <div class="col-md-4">
                <label>Size</label>
                <select class="form-select">
                  <option>Small</option>
                  <option>Medium</option>
                  <option>Large</option>
                </select>
              </div>
              <div class="col-md-4">
                <label>Stock</label>
                <input type="number" class="form-control" value="50" />
              </div>
              <div class="col-12">
                <label>Variant Image</label>
                <input type="file" class="form-control" accept="image/*" />
              </div>
              <div class="col-12 mt-3">
                <button type="submit" class="btn btn-success"><i class="bi bi-check-lg"></i> Save Variant</button>
                <a href="manage_products.html" class="btn btn-secondary ms-2">Cancel</a>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
