<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Report</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1;}
    .sidebar { background: var(--primary-color);
      min-height: 100vh;
      padding-top: 20px;
      color: white; }
      .sidebar a {
      color: #e0e7ff;
      padding: 12px 20px;
      display: block;
      border-radius: 8px;
      margin: 5px 15px;
      transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--secondary-color);
      color: white;
      text-decoration: none;
    }
    .chart-placeholder {
      height: 300px; background: #f8f9fa; border: 1px dashed #ccc;
      display: flex; align-items: center; justify-content: center; border-radius: 12px;
      color: var(--text-secondary); font-style: italic;
    }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar col-md-2"> 
        <div class="text-center mb-4"><h5>TechHub Store</h5></div>
      <a href="seller_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="add_product.html"><i class="bi bi-plus-circle"></i> Add Product</a>
      <a href="manage_products.html" ><i class="bi bi-grid"></i> Manage Products</a>
      <a href="add_variant.html" ><i class="bi bi-grid"></i> Add Variant</a>
      <a href="manage_orders.html" ><i class="bi bi-truck"></i> Orders</a>
      <a href="payment_report.html"class="active"><i class="bi bi-wallet2"></i> Payments</a>
      <a href="notifications.html"><i class="bi bi-bell"></i> Notifications</a>
      <a href="seller_profile.html"><i class="bi bi-person"></i> Profile</a>
      <a href="../login.html" class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="flex-grow-1 p-4">
      <h2>Payment Report</h2>
      <div class="row g-4 mt-3">
        <div class="col-md-4">
          <div class="card text-center p-3 shadow-sm">
            <h5>Total Earnings</h5>
            <h3 class="text-success">₹1,24,500</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-center p-3 shadow-sm">
            <h5>This Month</h5>
            <h3 class="text-primary">₹42,300</h3>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card text-center p-3 shadow-sm">
            <h5>Pending</h5>
            <h3 class="text-warning">₹8,200</h3>
          </div>
        </div>
      </div>

      <div class="card mt-4 shadow-sm">
        <div class="card-body">
          <h5>Sales Chart (Last 30 Days)</h5>
          <div class="chart-placeholder">
            [Chart.js or Google Chart will be here]
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
