<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    :root { --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1;}
    .sidebar {background: var(--primary-color);
      min-height: 100vh;
      padding-top: 20px;
      color: white; }
          .sidebar a {
      color: #e0e7ff;
      padding: 12px 20px;
      display: block;
      border-radius: 8px;
      margin: 5px 15px;
      transition: 0.3s;
    }
    .sidebar a:hover, .sidebar a.active {
      background: var(--secondary-color);
      color: white;
      text-decoration: none;
    }
    .notification-item {
      border-left: 4px solid var(--secondary-color);
      transition: 0.3s;
    }
    .notification-item:hover { background: #f8f9fa; }
    .unread { font-weight: 600; background: #ebf4ff; }
  </style>
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar col-md-2">
      <div class="text-center mb-4"><h5>TechHub Store</h5></div>
      <a href="seller_dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="add_product.html"><i class="bi bi-plus-circle"></i> Add Product</a>
      <a href="manage_products.html" ><i class="bi bi-grid"></i> Manage Products</a>
      <a href="add_variant.html" ><i class="bi bi-grid"></i> Add Variant</a>
      <a href="manage_orders.html" ><i class="bi bi-truck"></i> Orders</a>
      <a href="payment_report.html"><i class="bi bi-wallet2"></i> Payments</a>
      <a href="notifications.html"class="active"><i class="bi bi-bell"></i> Notifications</a>
      <a href="seller_profile.html"><i class="bi bi-person"></i> Profile</a>
      <a href="../login.html" class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <div class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Notifications <span class="badge bg-danger">3 New</span></h2>
        <a href="#" class="text-decoration-none">Mark all as read</a>
      </div>

      <div class="list-group">
        <div class="list-group-item notification-item unread">
          <div class="d-flex justify-content-between">
            <div>
              <strong>New Order #ORD1001</strong><br>
              <small class="text-muted">Amit placed order for Wireless Earbuds</small>
            </div>
            <small>2 min ago</small>
          </div>
        </div>
        <div class="list-group-item notification-item">
          <div class="d-flex justify-content-between">
            <div>
              <strong>Payment Received</strong><br>
              <small class="text-muted">₹2,999 credited to your account</small>
            </div>
            <small>1 hour ago</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
