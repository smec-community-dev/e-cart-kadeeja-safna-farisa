<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Add Product</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet"/>

  <style>
    :root {
      --primary-color: #1E40AF;
      --secondary-color: #3B82F6;
      --background-color: #FFFFFF;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --success-color: #16A34A;
      --error-color: #DC2626;
      --highlight-color: #6366F1;
    }

    .sidebar {
      background: var(--primary-color);
      min-height: 100vh;
      padding-top: 20px;
      color: white;
    }

    .sidebar a {
      color: #e0e7ff;
      padding: 12px 20px;
      display: block;
      border-radius: 8px;
      margin: 5px 15px;
      transition: 0.3s;
    }

    .sidebar a:hover, .sidebar a.active {
      background: var(--secondary-color);
      color: white;
      text-decoration: none;
    }

    .form-control, .form-select {
      border-radius: 8px;
    }

    .btn-add {
      background: var(--success-color);
      border: none;
      padding: 10px 30px;
      border-radius: 8px;
      color: white;
    }
  </style>

</head>
<body>

  <div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar col-md-2">
      <div class="text-center mb-4">
        <h5>TechHub Store</h5>
      </div>

      <a href="{% url 'seller_dashboard' %}" ><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="{% url 'add_product' %}" class="active"><i class="bi bi-plus-circle"></i> Add Product</a>
      <a href=""><i class="bi bi-grid"></i> Manage Products</a>
      <a href=""><i class="bi bi-truck"></i> Orders</a>
      <a href=""><i class="bi bi-wallet2"></i> Payments</a>
      <a href=""><i class="bi bi-bell"></i> Notifications</a>
      <a href=""><i class="bi bi-person"></i> Profile</a>
      <a href="" class="text-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1 p-4">

      <h2>Add New Product</h2>

      <form class="bg-white p-4 rounded shadow" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

        <div class="row g-3">

          <div class="col-md-6">
            <label>Product Name</label>
            <input type="text" name="name" class="form-control" required>
          </div>

          <div class="col-md-6">
            <label>Category</label>
            <select name="category" class="form-select" required>
              {% for cat in categories %}
              <option value="{{ cat.id }}">{{ cat.category_name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="col-12">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3"></textarea>
          </div>

          <div class="col-md-4">
            <label>Price (₹)</label>
            <input type="number" name="price" class="form-control" required>
          </div>

          <div class="col-md-4">
            <label>Stock</label>
            <input type="number" name="stock" class="form-control" required>
          </div>

          <!-- Image Upload Inputs -->
          <div class="col-md-12">
            <label>Product Images</label>

            <div id="image-container">
              <input type="file" name="images" class="form-control mb-2" accept="image/*">
            </div>

            <button type="button" class="btn btn-secondary mt-2" onclick="addImageField()">
              + Add More Images
            </button>
          </div>

          <div class="col-12 mt-3">
            <button type="submit" class="btn btn-add">
              <i class="bi bi-check-circle"></i> Add Product
            </button>
          </div>

        </div>

      </form>

      <script>
        function addImageField() {
          let container = document.getElementById("image-container");
          let input = document.createElement("input");
          input.type = "file";
          input.name = "images";
          input.className = "form-control mb-2";
          input.accept = "image/*";
          container.appendChild(input);
        }
      </script>

    </div>
  </div>

</body>
</html>
